name: Release

on:
  push:
    tags:
      - "v*"
  # These four targets are built exactly once per release, after the tag is
  # pushed and can no longer be moved — which is how the Linux build went two
  # releases without compiling (SH-259). Dispatching runs the same
  # cross-target build on any ref without minting a tag; the `release` job
  # below stays behind a tag guard, so a dispatched run produces artifacts and
  # publishes nothing. This is a build of the deploy artifact rather than a
  # test suite, so it does not contradict the project rule that Actions are
  # for deploys and tests are local.
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      # A release matrix is not a test matrix: cancelling the siblings of a
      # failed job saves minutes and costs every other platform its artifact.
      # When the Linux build broke, the default took both macOS builds and the
      # aarch64 Linux one down mid-compile, so the three targets that were
      # perfectly healthy produced nothing at all (SH-259) — not even
      # something a maintainer could attach by hand.
      #
      # Publishing stays all-or-nothing regardless (see `release`'s `needs`
      # below): a release missing one platform's asset is a 404 for that
      # platform's `install.sh` and `story update`, on a release that looks
      # complete. What this buys is a full report — every target's status in
      # one run instead of one per re-tag — and four artifacts on disk when
      # only one target is at fault.
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: story-x86_64-unknown-linux-gnu.tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: story-aarch64-unknown-linux-gnu.tar.gz
            cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: story-x86_64-apple-darwin.tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: story-aarch64-apple-darwin.tar.gz

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Package
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../${{ matrix.artifact }} story
          cd ../../..

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  # The release body, written here rather than left to GitHub.
  #
  # `generate_release_notes` counts from the newest TAG, published or not. A tag
  # that never published — v2.1.0, whose build died on one target — makes the
  # next release's generated notes describe the gap between two tags while the
  # reader upgrades between two releases. For v2.1.1 that was six pull requests
  # shown against seven hundred and forty-three commits delivered, with nothing
  # on the page saying so (SH-262).
  #
  # Deliberately not gated on a tag: this is the one check whose failure is
  # cheap only before the tag exists. `release` below is tag-gated and tags are
  # never moved here, so a body that cannot be rendered on a tag push leaves a
  # second permanently dangling tag. Running it on `workflow_dispatch` too means
  # the rehearsal that already proves the four targets build now also proves the
  # release has something honest to say.
  notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Render the release body
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME}"
          else
            version="$(cat VERSION)"
          fi

          # The newest published release is the version a user actually
          # upgrades FROM: `install.sh` and `story update` both resolve
          # `/releases/latest`, which is the newest release that is neither a
          # draft nor a prerelease. This asks the list endpoint for the same
          # thing and skips the version being cut, so re-running the workflow
          # on a tag that already published still renders the body it should
          # have had, instead of trying to measure a release from itself.
          # Nothing published at all yields an empty string — a first release,
          # not an error.
          since="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=30" \
            --jq "[.[] | select(.draft == false and .prerelease == false and .tag_name != \"${version}\")][0].tag_name // empty" \
            2>/dev/null || true)"

          arguments=(--version "$version" --repo "$GITHUB_REPOSITORY")
          if [ -n "$since" ]; then
            arguments+=(--since "$since")
          fi

          scripts/render-release-body.sh "${arguments[@]}" > release-body.md

          {
            echo "### Release body for \`${version}\`"
            echo
            cat release-body.md
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: release-body
          path: release-body.md

  release:
    # Strict on purpose, and the deliberate counterweight to `fail-fast:
    # false`: one failed target still blocks the release rather than
    # publishing a partial one. `notes` joins it for the same reason — a failed
    # render must stop the release, not fall back to generated-only notes.
    needs: [build, notes]
    # A dispatched run has no tag to release. Without this guard, adding the
    # `workflow_dispatch` trigger above would turn every on-demand build into
    # a failed publish step.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Scoped to the build artifacts by name: an unfiltered download would
      # sweep `release-body` into the same directory, and `files:` below
      # uploads everything in it as a release asset.
      - uses: actions/download-artifact@v4
        with:
          pattern: story-*
          path: artifacts
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          name: release-body
          path: notes

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          # GitHub pre-pends this to the generated notes rather than replacing
          # them, so the PR list and contributors survive underneath a body
          # that states the span the reader is actually crossing.
          body_path: notes/release-body.md
          generate_release_notes: true
          files: artifacts/*
          # A tag push builds and assembles a release; it does not SHIP one.
          #
          # Pushing a tag used to publish immediately, which forced a single
          # decision to be made twice over: whether the version is ready, and
          # whether the four platform builds actually work. v2.1.0 answered
          # the first yes and the second no — its build died on one target,
          # nothing published, and the tag has dangled ever since (SH-259).
          # A draft separates them. The tag push proves the build on every
          # platform and attaches all four assets; deciding to ship is then a
          # separate, reversible act against a release that is already
          # complete and inspectable.
          #
          # Holding it back is safe precisely because of what `/releases/latest`
          # means: the newest release that is neither a draft nor a
          # prerelease. `install.sh` and `story update` both resolve exactly
          # that, so a draft is invisible to every installer until it is
          # published — which is what makes a local version legitimately
          # running ahead of the public one, rather than a broken state.
          #
          # `scripts/release.sh --publish` flips it.
          draft: true
