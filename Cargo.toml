[package]
name = "storyhook"
version = "0.5.0"
edition = "2024"
rust-version = "1.89"
description = "CLI-first issue tracker for AI coding agents"
license = "MIT"
repository = "https://github.com/mikeydotio/storyhook"
readme = "README.md"
keywords = ["cli", "issue-tracker", "project-management", "developer-tools"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "story"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4.42", features = ["clock", "serde"] }
dialoguer = "0.12.0"
fs4 = "0.8.4"
rusqlite = { version = "0.32.1", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
toml = "0.8.23"
wait-timeout = "0.2"

[dev-dependencies]
assert_cmd = "2.1.1"
predicates = "3.1.3"
tempfile = "3.23.0"
