# `storyhook` is both the workspace root package and a workspace member, so the
# crate keeps its historic top-level layout (`src/`, `tests/`) and every path in
# git blame stays valid.
#
# `storyhook-test-support` is a *dev*-dependency here and depends on `storyhook`
# in turn. Cargo permits a dependency cycle that passes through a
# dev-dependency, and this one buys the thing the 44 integration-test binaries
# could not have otherwise: one compilation of the shared harness instead of one
# per binary, and a fixture builder that can be unit-tested in its own right.
# `cargo publish` strips path-only dev-dependencies, so the cycle never reaches
# a published manifest.
[workspace]
members = ["crates/storyhook-test-support"]
resolver = "3"

[workspace.dependencies]
assert_cmd = "2.1.1"
insta = { version = "1.44.1", features = ["json", "redactions", "filters"] }
predicates = "3.1.3"
proptest = "1.8.0"
# `raw_value` is what lets `src/legacy/` recover an archived event's *original*
# JSON text out of the array it is stored in, rather than re-serializing it. An
# event kind this binary does not understand has to survive a migration byte for
# byte, key order included, and a `Value` round trip sorts its keys.
serde_json = { version = "1.0.145", features = ["raw_value"] }
tempfile = "3.23.0"
ureq = "3"

[package]
name = "storyhook"
version = "2.2.1-beta.3"
edition = "2024"
rust-version = "1.89"
description = "CLI-first issue tracker for AI coding agents"
license = "MIT"
repository = "https://github.com/mikeydotio/storyhook"
readme = "README.md"
keywords = ["cli", "issue-tracker", "project-management", "developer-tools"]
categories = ["command-line-utilities", "development-tools"]

[features]
default = ["github-pr"]
# Named `github-sync` until SH-408 retired the story↔GitHub-Issues sync engine
# this gate used to serve; renamed alongside it because the code it now names
# is the PR watcher (`story link-pr`/`pr-check`/`github-auth`), not sync.
# `ureq` used to be gated here. It is unconditional now — the CLI's default
# invoker talks to the daemon over HTTP, so a build without an HTTP client
# could not run a command at all — and this feature gates only the PR-watcher
# code itself.
# `dep:keyring-core` and its per-platform backend ride this same gate rather
# than a feature of their own (SH-212): the OS-keychain-backed GitHub
# credential and the background poll thread that spends it exist only where
# `pr_check::run_check` — the code path they both call — is itself reachable.
# A `--no-default-features` build carries neither the dependencies nor the
# code that would touch a keychain. Referencing a target-specific optional
# dependency here is fine even on a platform that does not declare it: Cargo
# only activates the ones a given target actually has.
github-pr = [
    "dep:keyring-core",
    "dep:apple-native-keyring-store",
    "dep:zbus-secret-service-keyring-store",
]

# Named crash points inside the store (`src/store/fault.rs`). NEVER in
# `default`: with the feature off, every injection point is an inlined
# `Ok(())`, so a release binary carries no arming machinery at all.
#
# `cargo test` still gets it, because `storyhook-test-support` — a
# dev-dependency of this package — depends on `storyhook` *with* the feature.
# Cargo's v2 feature resolver keeps dev-dependency features out of non-test
# builds, so `cargo build` and `cargo build --release` are unaffected. That is
# what lets the store's crash tests run under the ordinary `make test` gate
# instead of behind a flag nothing remembers to pass.
fault-injection = []

# Gates `daemon::serve::bind_and_serve` (SH-148): a thin, in-process wrapper
# around the same `serve()` accept loop the real daemon uses, built for one
# caller — `storyhook-test-support`'s `try_serve_on` — which spins up a
# dashboard for a test without the pidfile lock, portfile, or startup backup a
# real daemon needs. NEVER in `default`: with the feature off, the function
# does not exist, so it cannot be reached from a release build no matter how
# `pub` its signature is. Same mechanism and same reasoning as
# `fault-injection` above, applied to a test seam instead of a crash point.
test-seam = []

# Keep each object file's debug info inside a single `.dwp`-style package next to
# the artifact instead of leaving the compiler's per-CGU `.o` files loose in
# `target/debug/deps/`. On macOS the unpacked default accumulates: this workspace
# put ~200k loose `.o` files there inside a day, and the resulting directory
# stalled `FSEventStreamStart` machine-globally (registration is serialized and
# costs ~5ms per stream once the directory is that large), which mass-failed the
# wall-clock readiness deadlines in `web_test`. Health metric:
# `ls target/debug/deps | wc -l` — trouble starts in the tens of thousands.
[profile.dev]
split-debuginfo = "packed"

[[bin]]
name = "story"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4.42", features = ["clock", "serde"] }
dialoguer = "0.12.0"
fs4 = "0.8.4"
rusqlite = { version = "0.32.1", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { workspace = true }
serde_yml = "0.0.12"
# The OS CSPRNG, for minting named dashboard tokens (SH-255) — 32 bytes with
# none of a UUID's fixed version/variant nibbles, so the token's own shape
# cannot be mistaken for (or "simplified" back into) a v4 UUID.
rand = "0.9"
regex = "1.12.3"
# The digest behind a store's daemon-state directory name. A store's identity
# determines its daemon's identity (docs/spec/store-isolation.md), and the
# directory that identity names must not depend on the path's length or on
# characters a filesystem may refuse -- so it is a hash of the canonical path
# rather than an escaping of it. Not a security boundary: the portfile carries
# the store path in full, so a collision would be detectable rather than silent.
sha2 = { version = "0.10", default-features = false, features = ["std"] }
thiserror = "2.0.17"
toml = "0.8.23"
# The portable identity of a project, minted by `story init` and carried in the
# repository's committed pointer file. It has to survive being copied to
# another machine, so it cannot be derived from a path or a counter.
uuid = { version = "1", features = ["v4"] }
wait-timeout = "0.2"

# An event hook is handed unlinked temporary files rather than pipes, so that no
# descendant of it can hold storyhook by keeping a pipe end open (SH-141). A
# regular file has no end-of-file rendezvous, which is what makes the wedge
# unrepresentable instead of merely bounded. `tempfile()` is the *unnamed*
# variant — created and immediately unlinked — so there is no path to clean up,
# nothing left behind after a SIGKILL, and nothing another process can open.
tempfile = { workspace = true }

# Web dashboard. `src/daemon/http1` is this crate's own HTTP/1.1 connection
# layer (SH-177), replacing `tiny_http` — `httparse` does head parsing only;
# framing, deadlines, the connection cap, and response writing are ours, so a
# peer socket is never owned by code this crate cannot reach a file
# descriptor through. Already in `Cargo.lock` via `ureq`'s `ureq-proto`, so
# this added no new dependency when it landed.
httparse = "1.10"
libc = "0.2"

# TUI
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
crossterm = "0.28"
tui-textarea = "0.7"
tui-input = "0.11"
ratatui-macros = "0.6"
tui-scrollview = "0.6"

# The RPC client. Not optional: the CLI's default invoker talks to the daemon
# over HTTP (locked decision 2), so a storyhook built without an HTTP client
# would have no way to run a command. github-pr uses the same one.
ureq = { version = "3", features = ["json"] }

# The platform-independent half of the durable GitHub credential `story
# github auth login` writes and the background poll thread reads (SH-212):
# the `Entry`/`CredentialStore` API. `src/domain/credential_store.rs` builds
# an `Arc<keyring_core::api::CredentialStore>` from one of the platform
# crates below in production, or `keyring_core::mock::Store` in tests — never
# through the crate's own global `set_default_store`, which would make every
# test that touches a credential share one process-wide static. `optional`,
# gated by `github-pr` — see that feature's own comment.
keyring-core = { version = "1", optional = true }

# Two platform stores, not three: this crate ships prebuilt binaries only for
# macOS and Linux (`.github/workflows/release.yml`'s matrix, `install.sh`).
# A `cfg(target_os = "windows")` table naming `windows-native-keyring-store`
# used to sit here — activated by default, compiled by nothing, so whether it
# even built was unknown. `libc` is an unconditional dependency here and
# `std::os::unix::*` runs unguarded through the daemon's spawn, portfile, and
# fd-hygiene paths, so a Windows target is not "one more `cfg` arm" the way
# Linux's was; it is a second platform's worth of work this project has not
# taken on. `src/github/credential_store.rs`'s fallback arm already answers
# "no keychain backend on this platform" for a build without one (SH-260).
[target.'cfg(target_os = "macos")'.dependencies]
# The "legacy keychain" store — available to every process without a
# provisioning profile, unlike the sandboxed "protected data" store this
# crate's `protected` feature would gate instead.
apple-native-keyring-store = { version = "1", optional = true, default-features = false, features = [
    "keychain",
] }

[target.'cfg(target_os = "linux")'.dependencies]
# The FreeDesktop Secret Service over D-Bus (GNOME Keyring, KWallet). `zbus`
# is a pure-Rust D-Bus client, so this needs no system `libdbus` install —
# unlike the crate ecosystem's `dbus`-based alternative.
#
# The feature is not optional in practice: `secret-service` 5.x is a bare
# `compile_error!` unless its consumer forwards a runtime choice, so without
# this the Linux artifact does not build at all (SH-259). Both halves of the
# choice follow the same rule as the crate itself — depend on nothing the
# target may not have:
#
# * `crypto-rust` over `crypto-openssl`, because `aarch64-unknown-linux-gnu`
#   is cross-compiled and a system OpenSSL is exactly what cannot be counted
#   on there. The pure-Rust primitives (`aes`, `cbc`, `sha2`, `hkdf`) build
#   for any target the compiler has.
# * `rt-async-io` over `rt-tokio`, because this crate has no async runtime and
#   wants none: every I/O path here is blocking (`ureq`, our own HTTP/1.1
#   layer). `async-io` is what `zbus` enables by default anyway, so this
#   selects the runtime already in the graph rather than adding a second.
#
# `tests/release_targets.rs` pins both, since `make test` is a macOS build and
# cannot otherwise see this line at all.
zbus-secret-service-keyring-store = { version = "1", optional = true, features = [
    "rt-async-io-crypto-rust",
] }

[dev-dependencies]
assert_cmd = { workspace = true }
insta = { workspace = true }
predicates = { workspace = true }
proptest = { workspace = true }
serde_json = { workspace = true }
storyhook-test-support = { path = "crates/storyhook-test-support" }
# `tempfile` is a runtime dependency since SH-141; tests inherit it and do not
# list it again.
ureq = { workspace = true }
