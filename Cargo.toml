# `storyhook` is both the workspace root package and a workspace member, so the
# crate keeps its historic top-level layout (`src/`, `tests/`) and every path in
# git blame stays valid.
#
# `storyhook-test-support` is a *dev*-dependency here and depends on `storyhook`
# in turn. Cargo permits a dependency cycle that passes through a
# dev-dependency, and this one buys the thing the 44 integration-test binaries
# could not have otherwise: one compilation of the shared harness instead of one
# per binary, and a fixture builder that can be unit-tested in its own right.
# `cargo publish` strips path-only dev-dependencies, so the cycle never reaches
# a published manifest.
[workspace]
members = ["crates/storyhook-test-support"]
resolver = "3"

[workspace.dependencies]
assert_cmd = "2.1.1"
insta = { version = "1.44.1", features = ["json", "redactions", "filters"] }
predicates = "3.1.3"
proptest = "1.8.0"
# `raw_value` is what lets `src/legacy/` recover an archived event's *original*
# JSON text out of the array it is stored in, rather than re-serializing it. An
# event kind this binary does not understand has to survive a migration byte for
# byte, key order included, and a `Value` round trip sorts its keys.
serde_json = { version = "1.0.145", features = ["raw_value"] }
tempfile = "3.23.0"
ureq = "3"

[package]
name = "storyhook"
version = "0.17.0"
edition = "2024"
rust-version = "1.89"
description = "CLI-first issue tracker for AI coding agents"
license = "MIT"
repository = "https://github.com/mikeydotio/storyhook"
readme = "README.md"
keywords = ["cli", "issue-tracker", "project-management", "developer-tools"]
categories = ["command-line-utilities", "development-tools"]

[features]
default = ["github-sync"]
github-sync = ["dep:ureq"]

# Named crash points inside the store (`src/store/fault.rs`). NEVER in
# `default`: with the feature off, every injection point is an inlined
# `Ok(())`, so a release binary carries no arming machinery at all.
#
# `cargo test` still gets it, because `storyhook-test-support` — a
# dev-dependency of this package — depends on `storyhook` *with* the feature.
# Cargo's v2 feature resolver keeps dev-dependency features out of non-test
# builds, so `cargo build` and `cargo build --release` are unaffected. That is
# what lets the store's crash tests run under the ordinary `make test` gate
# instead of behind a flag nothing remembers to pass.
fault-injection = []

# Keep each object file's debug info inside a single `.dwp`-style package next to
# the artifact instead of leaving the compiler's per-CGU `.o` files loose in
# `target/debug/deps/`. On macOS the unpacked default accumulates: this workspace
# put ~200k loose `.o` files there inside a day, and the resulting directory
# stalled `FSEventStreamStart` machine-globally (registration is serialized and
# costs ~5ms per stream once the directory is that large), which mass-failed the
# wall-clock readiness deadlines in `web_test`. Health metric:
# `ls target/debug/deps | wc -l` — trouble starts in the tens of thousands.
[profile.dev]
split-debuginfo = "packed"

[[bin]]
name = "story"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4.42", features = ["clock", "serde"] }
dialoguer = "0.12.0"
fs4 = "0.8.4"
rusqlite = { version = "0.32.1", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { workspace = true }
serde_yml = "0.0.12"
thiserror = "2.0.17"
toml = "0.8.23"
# The portable identity of a project, minted by `story init` and carried in the
# repository's committed pointer file. It has to survive being copied to
# another machine, so it cannot be derived from a path or a counter.
uuid = { version = "1", features = ["v4"] }
wait-timeout = "0.2"

# Web dashboard
tiny_http = "0.12"
libc = "0.2"

# TUI
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
crossterm = "0.28"
tui-textarea = "0.7"
tui-input = "0.11"
ratatui-macros = "0.6"
tui-scrollview = "0.6"
notify = "7"

# GitHub sync (optional)
ureq = { version = "3", optional = true, features = ["json"] }

[dev-dependencies]
assert_cmd = { workspace = true }
insta = { workspace = true }
predicates = { workspace = true }
proptest = { workspace = true }
serde_json = { workspace = true }
storyhook-test-support = { path = "crates/storyhook-test-support" }
tempfile = { workspace = true }
ureq = { workspace = true }
