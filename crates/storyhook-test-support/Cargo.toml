[package]
name = "storyhook-test-support"
version = "0.0.0"
edition = "2024"
rust-version = "1.89"
description = "Shared integration-test harness for storyhook. Not published."
license = "MIT"
publish = false

[dependencies]
assert_cmd = { workspace = true }
# `crash.rs` asserts that a daemon died by SIGKILL rather than by any other
# route, and the signal number is worth naming rather than spelling `9`.
libc = "0.2"
serde_json = { workspace = true }
# The `fault-injection` feature is requested here, not in the root
# manifest's `default`, so that `cargo test` builds a storyhook with the
# store's crash points live while `cargo build`/`--release` do not. Cargo's
# v2 resolver keeps dev-dependency features out of non-test builds, and
# this crate is a dev-dependency of storyhook.
storyhook = { path = "../..", features = ["fault-injection"] }
tempfile = { workspace = true }

[dev-dependencies]
ureq = { workspace = true }
